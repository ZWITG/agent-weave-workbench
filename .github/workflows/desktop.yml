name: Build Hive desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app
        run: bun install

      - name: Build Hive for desktop (Node server)
        env:
          HIVE_DESKTOP: "1"
        run: bun run build

      - name: Prepare desktop package
        shell: bash
        run: |
          rm -rf desktop/server
          cp -r .output desktop/server
          cp public/icon-512.png desktop/icon.png
          cd desktop
          npm install --no-audit --no-fund
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build and publish installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder --win --publish always
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=release
