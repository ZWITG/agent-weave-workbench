name: Build Tensai Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app
        run: bun install

      - name: Bundle offline speech model and runtime
        shell: bash
        run: |
          mkdir -p public/ort public/models/onnx-community/whisper-base/onnx
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded*.{mjs,wasm} public/ort/
          base=https://huggingface.co/onnx-community/whisper-base/resolve/main
          cd public/models/onnx-community/whisper-base
          for f in config.json generation_config.json preprocessor_config.json tokenizer.json tokenizer_config.json \
                   onnx/encoder_model_quantized.onnx onnx/decoder_model_merged_quantized.onnx; do
            curl -fsSL "$base/$f" -o "$f"
          done

      - name: Build Tensai for desktop (Node server)
        env:
          HIVE_DESKTOP: "1"
        run: bun run build

      - name: Prepare desktop package
        shell: bash
        run: |
          rm -rf desktop/server
          cp -r .output desktop/server
          cp public/icon-512.png desktop/icon.png
          cd desktop
          npm install --no-audit --no-fund
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      # electron-builder uploads the EXE and blockmap in parallel and each tries to create the
      # release, so the second fails with 422. Creating it first lets both just upload.
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "v1.0.${{ github.run_number }}"
          --target "${{ github.sha }}"
          --title "Tensai 1.0.${{ github.run_number }}"
          --notes "Windows installer: download Tensai-Setup.exe below."

      - name: Build and publish installer
        working-directory: desktop
        # bash, not the Windows default pwsh: pwsh splits `-c.publish.x=y` into `-c` + a file path.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder --win --publish always
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=release

      - name: Retain single-file installer
        uses: actions/upload-artifact@v4
        with:
          name: Tensai-Windows-installer
          path: desktop/dist/Tensai-Setup.exe
          if-no-files-found: error
