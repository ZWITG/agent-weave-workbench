name: Build Tensai Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.TENSAI_ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.TENSAI_ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.TENSAI_ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.TENSAI_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Check stable signing identity
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_STORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || { echo 'Configure the four TENSAI_ANDROID signing secrets before building an installable release.'; exit 1; }
      - name: Generate Android shell
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER'))
                  versionName '1.0.' + System.getenv('GITHUB_RUN_NUMBER')
              }
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('ANDROID_STORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
      - name: Build signed APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Tensai.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Tensai-Android-installer
          path: Tensai.apk
      # One rolling "android" release so the download link never changes, kept out of "latest"
      # because the desktop auto-updater reads latest.yml from the latest release.
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --latest=false --title "Tensai Android" --notes "Online Android app. Offline Android AI is not included."
          gh release edit android --latest=false --title "Tensai Android 1.0.${{ github.run_number }}"
          gh release upload android Tensai.apk --clobber
